<div class="login-page">
  <mat-card class="login-card" appearance="outlined">

    <mat-card-header>
      <mat-card-title>
        Iniciar sesión
      </mat-card-title>

      <mat-card-subtitle>
        Sistema de acceso básico conectado al backend FastAPI.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      @if (loading()) {

  <div class="center">
    <mat-spinner diameter="40" />
  </div>

} @else {

  @if (!registerMode()) {

    <!-- LOGIN -->

    <form
      [formGroup]="loginForm"
      (ngSubmit)="ingresar()"
      class="login-form"
    >

      <mat-form-field appearance="outline" class="full">
        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Contraseña</mat-label>

        <input
          matInput
          type="password"
          formControlName="contrasena"
          autocomplete="current-password"
        />
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="submit-btn"
      >
        Ingresar
      </button>

      <button
        mat-button
        type="button"
        class="submit-btn"
        (click)="showRegister()"
      >
        Crear cuenta
      </button>

    </form>

  } @else {

    <!-- REGISTER -->

    <form
      [formGroup]="firstUserForm"
      (ngSubmit)="crearPrimero()"
      class="form-grid"
    >

      <mat-form-field appearance="outline">
        <mat-label>Nombre de usuario</mat-label>

        <input
          matInput
          formControlName="nombre_usuario"
          autocomplete="username"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>

        <input
          matInput
          type="password"
          formControlName="contrasena"
          autocomplete="new-password"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Rol</mat-label>

        <input
          matInput
          formControlName="rol"
        />
      </mat-form-field>

      <div class="span-2 actions">

        <button
          mat-flat-button
          color="primary"
          type="submit"
        >
          Registrarse
        </button>

        <button
          mat-button
          type="button"
          (click)="showLogin()"
        >
          Volver al login
        </button>

      </div>

    </form>

  }

}

    </mat-card-content>

  </mat-card>
</div>
