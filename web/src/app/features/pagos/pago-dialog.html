<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo pago' : 'Editar pago' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Pedido (ID)</mat-label>
      <mat-select formControlName="id_pedido">
        @for (p of pedidos(); track p.id_pedido) {
          <mat-option [value]="p.id_pedido">{{ p.id_pedido.slice(0, 8) }}…</mat-option>
        }
      </mat-select>
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Método de Pago</mat-label>
      <input matInput formControlName="metodo_pago" placeholder="Ej: Tarjeta, Transferencia, Efectivo" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Monto Pagado</mat-label>
      <input matInput type="number" formControlName="monto_pagado" min="0" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
